/* Layout: el mismo banco de trabajo que Scannice Zócalo, Align, Offset, Swap y Articulator. Panel de pasos en pestañas a la izquierda,
   escena 3D a la derecha con el panel de sección abajo; en móvil la escena arriba y los pasos debajo. Aspecto «Grafito». */
:root,:root[data-theme="dark"]{
  --stage:#1d2530; --panel:#2f3338; --field:#1a1d20; --ink:#dfe3e8; --muted:#9aa1aa; --line:#0f1113;
  --accent:#3fb6ff; --accent-ink:#06131d; --bright:#7fd2ff; --warn:#ff9b7d; --axis:#9fd8ff; --scrim:rgba(4,8,14,.6);
  --upper:#29A9FF; --lower:#00B400; --bite:#C98BFF; --piece:#FF9F43; --comb:#FFD400; --ref:#FF5A3C; --plane:#FFFFFF; --metal:#8a939b;
  --ok:#5FD08E; --ok-bg:#0F2E1D; --rev:#F0B85A; --rev-bg:#33260C; --bad:#F08A6E; --bad-bg:#3A1A12;
  --body-bg:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,rgba(0,0,0,.04) 1px 3px),linear-gradient(180deg,#2b2e33,#1f2226);
  --plate:linear-gradient(180deg,#34383e,#292c31); --plate-top:#34383e; --plate-edge:rgba(0,0,0,.55); --plate-hi:rgba(255,255,255,.08);
  --btn:linear-gradient(180deg,#464b52,#33373d); --btn-hi:rgba(255,255,255,.14); --btn-edge:rgba(0,0,0,.6);
  --well:#17191c; --well-sh:inset 0 2px 6px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.06);
  --track:#0e1012; --cap:linear-gradient(180deg,#9aa1aa,#4a5058); --cap-edge:#0b0c0e;
  --tabbar:#1f2226; --tab:linear-gradient(180deg,#2a2d32,#24272b); --tab-ink:#8d949d; --tab-on-ink:#7fd2ff; --led-off:#3a3f45; --led:#3fb6ff; --led-deep:#0d5e99;
  --glow:0 0 12px rgba(63,182,255,.35);
  --display:"Source Sans 3","Myriad Pro","Segoe UI",sans-serif;
  --body:"Source Sans 3","Myriad Pro","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --label:Rajdhani,"Source Sans 3","Segoe UI",sans-serif;
  color-scheme:dark }
:root[data-theme="light"]{
  --stage:#dfe4ea; --panel:#eceef1; --field:#d5d9de; --ink:#23272c; --muted:#555c65; --line:#a9afb6;
  --accent:#1f8ad8; --accent-ink:#ffffff; --bright:#0b6ab0; --warn:#b4472e; --axis:#0b5d99; --scrim:rgba(30,40,55,.45);
  --upper:#1C8EDB; --lower:#00A000; --bite:#9B5BD6; --piece:#E07B12; --comb:#E6B800; --ref:#E0451F; --plane:#2a2f36; --metal:#7d868f;
  --ok:#137A3E; --ok-bg:#E2F3E8; --rev:#9A6400; --rev-bg:#FBF0D9; --bad:#B4472E; --bad-bg:#FBE7E2;
  --body-bg:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,rgba(0,0,0,.025) 1px 3px),linear-gradient(180deg,#dfe2e6,#cdd1d6);
  --plate:linear-gradient(180deg,#f2f3f5,#e3e6ea); --plate-top:#f2f3f5; --plate-edge:rgba(0,0,0,.14); --plate-hi:#ffffff;
  --btn:linear-gradient(180deg,#fdfdfe,#dde0e4); --btn-hi:#ffffff; --btn-edge:rgba(0,0,0,.2);
  --well:#d5d9de; --well-sh:inset 0 2px 5px rgba(0,0,0,.22),0 1px 0 #ffffff;
  --track:#b9bec4; --cap:linear-gradient(180deg,#ffffff,#b8bec5); --cap-edge:#8a9098;
  --tabbar:#d3d7dc; --tab:linear-gradient(180deg,#dde0e4,#cfd3d8); --tab-ink:#5f666f; --tab-on-ink:#0b5d99; --led-off:#b3b8be; --led:#1f8ad8; --led-deep:#0d4f80;
  --glow:0 0 8px rgba(31,138,216,.3); color-scheme:light }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--body-bg);background-color:var(--field);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.42}
.app{position:relative;display:grid;grid-template-columns:var(--pw,420px) minmax(0,1fr);gap:14px;height:100%;
  padding-block:14px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.panel{overflow-y:auto;min-width:0;display:flex;flex-direction:column;gap:14px;padding:16px 16px 18px;background:var(--plate);border-radius:14px;
  box-shadow:inset 0 1px 0 var(--plate-hi),0 0 0 1px var(--plate-edge),0 6px 14px rgba(0,0,0,.3)}
.panel>*{flex-shrink:0}
.stage{position:relative;background:var(--stage);min-width:0;min-height:0;overflow:hidden;border-radius:14px;box-shadow:inset 0 2px 10px rgba(0,0,0,.6),0 0 0 1px var(--plate-edge)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;outline-offset:-3px;border-radius:14px}
.stage.picking canvas{cursor:crosshair}

/* cabecera */
.brand .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand img{display:block;width:156px;height:auto}
.brand h1{font-family:var(--label);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--bright);margin:10px 0 0}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px;font-weight:600;max-width:40ch;text-wrap:balance}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 6px;white-space:nowrap}
.brand .tag{display:inline-block;margin-top:8px}
.icons{display:flex;gap:6px;align-items:center}
.icon{width:32px;height:32px;padding:0!important;display:inline-grid;place-items:center;border-radius:50%!important}
.icon svg{width:17px;height:17px;display:block}
.lang button{padding:4px 9px;font-size:12.5px;font-family:var(--mono)}

/* controles */
button,label.btn{font:inherit;color:var(--ink);background:var(--btn);border:0;border-radius:8px;padding:7px 11px;cursor:pointer;display:inline-block;
  box-shadow:inset 0 1px 0 var(--btn-hi),0 0 0 1px var(--btn-edge),0 2px 4px rgba(0,0,0,.35)}
button:hover,label.btn:hover{color:var(--bright)}
button:disabled{opacity:.4;cursor:not-allowed;box-shadow:inset 0 1px 0 var(--btn-hi),0 0 0 1px var(--btn-edge)}
.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 72%,#fff),var(--accent))!important;color:var(--accent-ink)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 0 1px color-mix(in srgb,var(--accent) 60%,#000),var(--glow)!important;
  font-family:var(--label);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.primary:hover{filter:brightness(1.06)}
.wide{width:100%;padding:10px 12px}
.sm{padding:4px 9px;font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border-radius:9px;background:var(--well);box-shadow:var(--well-sh);padding:3px;gap:3px}
.seg button{border-radius:6px;background:transparent;box-shadow:none;padding:6px 11px}
.seg button[aria-pressed="true"],.mk .hd button[aria-pressed="true"]{background:var(--well);color:var(--tab-on-ink);box-shadow:inset 0 2px 5px rgba(0,0,0,.45),0 0 0 1px var(--accent),var(--glow)}
.seg.full{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
input[type=number],input[type=text],select.sel{font:500 14px var(--mono);color:var(--ink);background:var(--well);border:0;border-radius:8px;box-shadow:var(--well-sh);padding:7px 8px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
input[type=text],select.sel{font:14px var(--body)}
.unit{position:relative;min-width:0;width:100%}
.unit::after{content:attr(data-u);position:absolute;right:8px;top:50%;transform:translateY(-50%);font:12px var(--mono);color:var(--muted);pointer-events:none}
.unit input{padding-right:30px}

/* pestañas de pasos */
.steptabs{display:flex;align-items:flex-end;gap:2px;margin:2px -16px 0;padding:10px 8px 0;background:var(--tabbar);border-bottom:1px solid var(--line)}
.steptabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px 0 7px;border-radius:9px 9px 0 0;background:var(--tab);color:var(--tab-ink);
  box-shadow:inset 0 1px 0 var(--btn-hi);border:1px solid var(--line);border-bottom:0;margin-bottom:-1px;position:relative;font:700 11.5px var(--label);letter-spacing:0;text-transform:uppercase}
.steptabs button span:last-child{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steptabs button[aria-selected="true"]{background:var(--plate-top);color:var(--tab-on-ink);box-shadow:inset 0 2px 0 var(--accent);z-index:1}
.steptabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--plate-top)}
.led{width:8px;height:8px;border-radius:50%;flex:none;background:var(--led-off);box-shadow:inset 0 1px 1px rgba(0,0,0,.5)}
.led.on{background:radial-gradient(circle at 35% 30%,#d9f3ff,var(--led) 55%,var(--led-deep));box-shadow:0 0 7px var(--led)}

/* pasos */
.step{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.panel .step:not(.on){display:none}
.step h2{font-family:var(--label);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:15px;color:var(--muted);margin:0;display:flex;align-items:baseline;gap:9px;text-wrap:balance}
.step h2 b{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:0;color:var(--accent);border:1px solid var(--accent);border-radius:50%;width:21px;height:21px;display:inline-grid;place-items:center;flex:none;transform:translateY(-1px)}
.step h3{font-family:var(--label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted);margin:8px 0 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.help{color:var(--muted);font-size:12.5px;margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.fld>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.slot{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:9px;align-items:center;background:var(--well);border-radius:9px;box-shadow:var(--well-sh);padding:8px 8px 8px 10px}
.slot.empty .t b{color:var(--muted);font-weight:600}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.25)}
.slot .t{min-width:0;display:flex;flex-direction:column}
.slot .t b{font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .t small{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .a{display:flex;gap:4px;align-items:center}
.slot .a .x{padding:3px 8px;font-size:12.5px;color:var(--muted)}
.slot .a .x:hover{color:var(--warn)}

.marks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mk{background:var(--well);border-radius:10px;box-shadow:var(--well-sh);padding:8px 10px}
.mk.picking{box-shadow:var(--well-sh),inset 3px 0 0 var(--accent)}
.mk .hd{display:flex;align-items:center;gap:8px;min-width:0}
.mk .hd .k{font-family:var(--mono);font-size:12px;color:var(--ref);width:44px;flex:none}
.mk .hd div{min-width:0;flex:1;display:flex;flex-direction:column}
.mk .hd b{font-weight:600;font-size:14px;line-height:1.2}
.mk .hd small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk .hd small.ok{color:var(--ok)}
.mk .hd button{padding:4px 10px;font-size:12.5px;flex:none}

.pairs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pr{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center;background:var(--well);border-radius:10px;box-shadow:var(--well-sh);padding:6px 8px}
.pr .n{font-family:var(--mono);font-size:12px;color:var(--ref)}
.pr button{padding:5px 6px;font-size:12.5px;display:flex;align-items:center;gap:6px;justify-content:center;min-width:0}
.pr button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr button i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--led-off)}
.pr button.set i{background:var(--ok)}
.pr button[aria-pressed="true"]{color:var(--tab-on-ink);box-shadow:inset 0 2px 5px rgba(0,0,0,.45),0 0 0 1px var(--accent),var(--glow)}
.pr .x{padding:3px 8px;color:var(--muted)}
.pr.empty{background:transparent;box-shadow:none;border:1px dashed var(--line);color:var(--muted);font-size:12.5px;grid-template-columns:1fr;padding:10px}
.seg.full3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}
.seg.full3 button{padding:6px 3px;font-size:13px}
.seg.full3 button:disabled{opacity:.35}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.chk input{accent-color:var(--accent);margin:0;width:16px;height:16px}
.lasso{position:absolute;inset:0;z-index:3;cursor:crosshair;touch-action:none;width:100%;height:100%}
.lasso path{fill:color-mix(in srgb,var(--bright) 14%,transparent);stroke:var(--bright);stroke-width:1.5;stroke-dasharray:5 4}
.seg.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}
.seg.modes button{padding:6px 3px;font-size:12.5px;line-height:1.15}
.seg.modes button:disabled{opacity:.35}
.fine{display:grid;grid-template-columns:30px minmax(0,1fr) 96px;gap:2px 10px;align-items:center}
.fine .ax{font-family:var(--mono);font-size:12px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;--pct:50%;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:5px;background:linear-gradient(90deg,var(--accent) 0 var(--pct),var(--track) var(--pct) 100%);box-shadow:inset 0 1px 3px rgba(0,0,0,.8),0 1px 0 var(--plate-hi)}
input[type=range]::-moz-range-track{height:8px;border-radius:5px;background:var(--track);box-shadow:inset 0 1px 3px rgba(0,0,0,.8)}
input[type=range]::-moz-range-progress{height:8px;border-radius:5px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:28px;margin-top:-10px;border-radius:4px;background:linear-gradient(180deg,transparent 12px,var(--accent) 12px,var(--accent) 15px,transparent 15px),var(--cap);box-shadow:0 0 0 1px var(--cap-edge),0 3px 6px rgba(0,0,0,.6);cursor:grab}
input[type=range]::-moz-range-thumb{width:18px;height:28px;border:0;border-radius:4px;background:linear-gradient(180deg,transparent 12px,var(--accent) 12px,var(--accent) 15px,transparent 15px),var(--cap);box-shadow:0 0 0 1px var(--cap-edge),0 3px 6px rgba(0,0,0,.6);cursor:grab}

.light{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.light::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.light.ok{color:var(--ok);background:var(--ok-bg)} .light.rev{color:var(--rev);background:var(--rev-bg)} .light.bad{color:var(--bad);background:var(--bad-bg)}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;margin:0;font-size:12px}
.nums div{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:4px;min-width:0}
.nums dt{color:var(--muted)}
.nums dd{margin:0;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.nums dd.ok{color:var(--ok)} .nums dd.rev{color:var(--rev)} .nums dd.bad{color:var(--bad)}
.note{font-size:12.5px;padding:7px 9px;border-radius:8px;margin:0;background:var(--well);box-shadow:var(--well-sh)}
.note.ok{color:var(--ok);box-shadow:var(--well-sh),0 0 0 1px var(--ok)}
.note.rev{color:var(--rev);box-shadow:var(--well-sh),0 0 0 1px var(--rev)}
.note.bad{color:var(--bad);box-shadow:var(--well-sh),0 0 0 1px var(--bad)}
.file{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin:0}
.foot{color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:14px;margin:0}

/* escena */
.hud{position:absolute;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.hud>*{pointer-events:auto}
.hud.top{top:12px}
.hud.bot{bottom:12px;justify-content:space-between;align-items:flex-end;flex-wrap:nowrap}
.info,.status,.legend{background:var(--well);box-shadow:var(--well-sh);border-radius:9px}
.info{font-family:var(--mono);font-size:12px;color:var(--bright);padding:5px 9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.status{min-width:0;font-size:12.5px;color:var(--ink);padding:6px 10px;max-width:min(100%,60ch)}
.status.warn{color:var(--warn);box-shadow:var(--well-sh),0 0 0 1px var(--warn)}
.mark{width:clamp(96px,14vw,150px);height:auto;flex:none;pointer-events:none;opacity:.85}
.vcube{position:absolute;right:26px;top:70px;width:76px;height:76px;pointer-events:auto;perspective:none;cursor:grab;touch-action:none;border-radius:50%}
.vcube.dragging,.vcube.dragging button{cursor:grabbing}
.vcube.dragging button:hover{background:var(--btn);color:var(--ink)}
.vcube .cube{position:absolute;left:12px;top:12px;width:52px;height:52px;transform-style:preserve-3d}
.vcube button{position:absolute;inset:0;width:52px;height:52px;padding:0;border-radius:3px;font:700 13px/1 var(--mono);backface-visibility:hidden;pointer-events:auto;box-shadow:inset 0 1px 0 var(--btn-hi),0 0 0 1px var(--btn-edge)}
.vcube button:hover{background:var(--accent);color:var(--accent-ink)}
.triad{position:absolute;left:14px;bottom:62px;width:100px;height:100px;pointer-events:none}
.triad text{font:700 12px var(--mono)}
.legend{position:absolute;right:14px;top:166px;width:184px;padding:8px 10px;font-size:12px;color:var(--ink);display:flex;flex-direction:column;gap:5px}
.legend .ln{display:flex;align-items:center;gap:7px}
.legend .ln i{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.25)}
.legend .ln i.line{height:3px;border:0;border-radius:2px}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.labels div{position:absolute;transform:translate(-50%,-150%);font:500 11px var(--mono);background:var(--well);color:var(--ink);box-shadow:0 0 0 1px var(--ref);border-radius:4px;padding:1px 5px;white-space:nowrap}
.pickbar{position:absolute;left:50%;top:104px;transform:translateX(-50%);width:min(520px,calc(100% - 24px));display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:#fff;background:#0A3058;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:4;font-size:13.5px}
.pickbar b{display:block;font-family:var(--display);font-size:16px}
.pickbar div{flex:1;min-width:0}
.pickbar button{background:#fff;color:#2A2B31;font-weight:600;padding:6px 11px;font-size:13px}
.busy{position:absolute;inset:0;z-index:6;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--stage) 35%,transparent)}
.busy .card{background:var(--plate);color:var(--ink);border-radius:12px;padding:18px 22px;width:min(340px,100%);display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 1px 0 var(--plate-hi),0 0 0 1px var(--plate-edge),0 14px 40px var(--scrim)}
.busy b{font-family:var(--display);font-weight:600;font-size:16px}
.busy small{font-family:var(--mono);font-size:12px;color:var(--muted)}
.prog{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:40%;background:var(--bright);animation:slide 1.1s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-20%)}to{transform:translateX(170%)}}
.drop{position:absolute;inset:10px;border:2px dashed var(--axis);border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--axis);background:color-mix(in srgb,var(--stage) 80%,transparent);pointer-events:none;text-align:center;padding:16px}
.grip{position:absolute;top:14px;bottom:14px;left:calc(max(14px,env(safe-area-inset-left,0px)) + var(--pw,420px));width:14px;padding:0;border:0;background:transparent;box-shadow:none;cursor:col-resize;display:grid;place-items:center;z-index:5;border-radius:0}
.grip span{width:4px;height:56px;border-radius:3px;background:repeating-linear-gradient(180deg,var(--muted) 0 3px,transparent 3px 6px);opacity:.7}
.grip:hover span,.grip:focus-visible span{background:repeating-linear-gradient(180deg,var(--accent) 0 3px,transparent 3px 6px);opacity:1}

/* ventanas */
.modal{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:40}
.sheet{position:relative;background:var(--plate-top);color:var(--ink);border-radius:12px;width:100%;max-width:880px;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;align-items:center;gap:12px;padding:18px 20px 12px}
.sheet h2{font-family:var(--display);font-weight:700;font-size:21px;margin:0}
.sheet .x{margin-left:auto;flex:none;width:32px;height:32px;padding:0;border-radius:50%;font-size:18px;line-height:1}
.sheet.small{max-width:480px}
.help-body{overflow:auto;padding:16px 20px 22px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.help-body section{display:flex;flex-direction:column;gap:8px;max-width:72ch}
.help-body h3{font-family:var(--display);font-weight:600;font-size:16px;margin:0;display:flex;gap:8px;align-items:baseline}
.help-body h3 b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:50%;width:21px;height:21px;display:inline-grid;place-items:center;flex:none}
.help-body p{margin:0;font-size:14px}
.help-body ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.help-body kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--field)}
.contact-body{padding:4px 20px 20px;display:flex;flex-direction:column;gap:10px}
.contact-body .cname{margin:0;font-weight:600;font-size:16px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px;min-width:0}
.crow div{min-width:0}
.crow small{display:block;color:var(--muted);font-size:12px}
.crow span{user-select:all;overflow-wrap:anywhere;font-size:15px}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:52% minmax(0,1fr);gap:8px;padding-block:8px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .stage{order:-1}
  .grip,.steptabs,.legend,.triad{display:none}
  .panel .step{display:flex}
  .vcube{top:auto;bottom:56px;right:6px;transform:scale(.8)}
  .pickbar{top:auto;bottom:60px}
  .hud.top .seg button{padding:5px 8px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- Visor: piezas compartidas por el generador y el HTML del doctor ---- */
.labels .mchip{position:absolute;transform:translate(-50%,-50%);font:500 12px var(--mono);background:var(--well);color:var(--ink);box-shadow:0 0 0 1px var(--ref);border-radius:4px;padding:1px 6px;white-space:nowrap}
.objs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.obj{display:grid;grid-template-columns:auto 22px minmax(0,1fr) auto;gap:4px 8px;align-items:center;background:var(--well);border-radius:9px;box-shadow:var(--well-sh);padding:7px 8px}
.obj.off{opacity:.55}
.obj .eye{width:30px;height:28px;padding:0;display:grid;place-items:center}
.obj .eye svg{width:17px;height:17px}
.obj .sw{width:22px;height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.35);padding:0;position:relative;overflow:hidden;cursor:pointer;display:block}
.obj .sw input{position:absolute;inset:-6px;width:40px;height:40px;opacity:0;cursor:pointer}
.obj .sw.nat{background:conic-gradient(#d9b9a0,#f4efe6,#c76d6d,#e8d6c0,#d9b9a0)!important}
.obj .t{min-width:0;display:flex;flex-direction:column}
.obj .t b{font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obj .t small{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obj .op{grid-column:2 / -1;display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center}
.obj .op span{font:500 12px var(--mono);color:var(--muted);text-align:right}
.obj .op input{height:22px}
.obj .op input::-webkit-slider-thumb{width:14px;height:22px;margin-top:-7px}
.obj .nat{font-size:12px}
.meas{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
.meas li{font:500 12.5px var(--mono);background:var(--well);box-shadow:var(--well-sh),0 0 0 1px var(--ref);border-radius:6px;padding:2px 8px}
.labbrand{display:flex;align-items:center;gap:10px;min-width:0}
.labbrand img{display:block;max-width:170px;max-height:56px;width:auto;height:auto;object-fit:contain}
.labbrand b{font-family:var(--label);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);line-height:1.1;overflow-wrap:anywhere}
textarea{font:14px var(--body);color:var(--ink);background:var(--well);border:0;border-radius:8px;box-shadow:var(--well-sh);padding:7px 8px;width:100%;resize:vertical;min-height:60px}
input[type=password],input[type=email],input[type=tel],input[type=date]{font:14px var(--body);color:var(--ink);background:var(--well);border:0;border-radius:8px;box-shadow:var(--well-sh);padding:8px 9px;width:100%;min-width:0}
.stage .hud.top .seg button{padding:6px 9px}
.busy .card small{overflow-wrap:anywhere}
.busy .slowhint{margin:4px 0 0;font-size:12.5px;line-height:1.4;color:var(--muted);opacity:0;animation:snvhint .3s 9s forwards}
.busy .slowhint i{font-style:normal;display:block;margin-top:4px}
@keyframes snvhint{to{opacity:1}}
/* ---- vista sin JavaScript ---- */
.nojs-page{display:none}
html.nojs .app,html.nojs .modal{display:none!important}
html.nojs,html.nojs body{height:auto;overflow:auto}
html.nojs .nojs-page{display:flex;flex-direction:column;gap:14px;padding:18px 16px 28px;max-width:860px;margin:0 auto}
.nojs-page h1{font-family:var(--label);font-weight:700;font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:var(--bright);margin:4px 0 0}
.nojs-page h2{font-family:var(--label);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.nojs-page .nj-sub{margin:-8px 0 0;color:var(--muted);font-weight:600}
.nojs-page .note{font-size:14px;line-height:1.45}
.nojs-page figure{margin:0;background:var(--stage);border-radius:12px;overflow:hidden;box-shadow:inset 0 2px 10px rgba(0,0,0,.6),0 0 0 1px var(--plate-edge)}
.nojs-page figure img{display:block;width:100%;height:auto}
.nojs-page figcaption{font:600 13px var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 12px;background:var(--plate-top)}
.nj-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.nj-list li{display:flex;align-items:center;gap:9px;background:var(--well);box-shadow:var(--well-sh);border-radius:9px;padding:8px 10px}
.nj-list i{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.3)}
.nj-links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nj-btn{display:block;text-align:center;text-decoration:none;color:var(--ink);background:var(--btn);border-radius:8px;padding:11px 10px;box-shadow:inset 0 1px 0 var(--btn-hi),0 0 0 1px var(--btn-edge),0 2px 4px rgba(0,0,0,.35);font-weight:600}
/* giro 360° sin JavaScript: el desplazamiento horizontal elige el fotograma (scroll-driven animations);
   si el navegador no las tiene, el modelo gira solo */
.spin{position:relative;display:flex;overflow-x:auto;overflow-y:hidden;scroll-timeline:--spin x;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.spin::-webkit-scrollbar{display:none}
.spin-frames{position:sticky;left:0;flex:none;width:100%;aspect-ratio:4/3;margin-right:-100%;z-index:1;pointer-events:none}
.spin-frames img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.spin-frames img:first-child{opacity:1}
.spin-track{flex:none;width:900%;height:1px}
.spin-hand{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font:600 18px var(--mono);color:var(--bright);background:var(--well);border-radius:99px;padding:2px 14px;box-shadow:0 0 0 1px var(--accent);opacity:.9}
.sc-auto{display:none}
@keyframes snvFrame{from,to{opacity:1}}
@keyframes snvAuto{0%,2.7%{opacity:1}2.8%,100%{opacity:0}}
@supports (animation-timeline: scroll()){
  .spin-frames img{animation:snvFrame linear both;animation-timeline:--spin;animation-range:var(--a) var(--b);animation-fill-mode:none}
  .spin-frames img:first-child{opacity:0}
  .spin-frames img:last-child{animation-range:var(--a) 100.1%}
}
@supports not (animation-timeline: scroll()){
  .spin{overflow:hidden}
  .spin-track,.spin-hand,.sc-swipe{display:none}
  .sc-auto{display:inline}
  .spin-frames img{animation:snvAuto 7.2s linear infinite;animation-delay:calc(var(--i) * .2s - 7.2s)}
  .spin-frames img:first-child{opacity:0}
}
/* ---- visor del doctor en el móvil: escena a pantalla completa, panel en hoja inferior ---- */
.sheetbtn,.sheetclose{display:none}
.status{transition:opacity .4s}
.status.gone{opacity:0;pointer-events:none}
@media (max-width:760px), (max-height:500px) and (orientation:landscape){
  html,body{overflow:hidden;overscroll-behavior:none}
  .vw.app{display:block;height:100dvh;padding:0}
  .vw .stage{position:fixed;inset:0;border-radius:0;box-shadow:none}
  .vw .stage canvas{border-radius:0}
  .vw .panel{position:fixed;left:0;right:0;bottom:0;max-height:78dvh;border-radius:16px 16px 0 0;z-index:30;transform:translateY(calc(100% + 20px));transition:transform .28s ease;
    padding:14px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:inset 0 1px 0 var(--plate-hi),0 -10px 30px rgba(0,0,0,.45)}
  .vw.sheet-open .panel{transform:none}
  .vw .panel::before{content:"";align-self:center;width:42px;height:5px;border-radius:3px;background:var(--muted);opacity:.5;margin:-4px 0 2px}
  .vw .sheetclose{display:inline-grid;font-size:16px}
  .vw .sheetbtn{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
  .vw .sheetbtn svg{width:16px;height:16px}
  .vw .hud.top{top:calc(8px + env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));flex-wrap:nowrap;gap:6px}
  .vw .hud.top .info{min-width:0;flex:1 1 auto;overflow:hidden;white-space:nowrap;padding:6px 9px}
  .vw .hud.top .info span{overflow:hidden;text-overflow:ellipsis}
  .vw .hud.top>button{flex:none;padding:7px 10px}
  .vw #viewSeg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;box-shadow:var(--well-sh),0 4px 14px rgba(0,0,0,.4)}
  .vw #viewSeg button{padding:9px 12px;font-size:14px}
  .vw .hud.bot{bottom:calc(64px + env(safe-area-inset-bottom));justify-content:center}
  .vw .hud.bot .mark{display:none}
  .vw .vcube{top:calc(56px + env(safe-area-inset-top));bottom:auto;right:2px;transform:scale(.68);transform-origin:top right}
  .vw .pickbar{top:calc(60px + env(safe-area-inset-top));bottom:auto}
  .vw .labels .mchip{font-size:13px}
  .vw .triad{display:none}
}
@media (max-height:500px) and (orientation:landscape){
  .vw .panel{left:auto;width:min(420px,60vw);top:0;max-height:none;border-radius:16px 0 0 16px;transform:translateX(calc(100% + 20px))}
  .vw.sheet-open .panel{transform:none}
}

        <button type="button" data-view="upper" aria-pressed="false" data-t="v_upper"></button>
        <button type="button" data-view="lower" aria-pressed="false" data-t="v_lower"></button>

    </div>
    <div class="pickbar" id="pickbar" hidden role="status"><div><b data-t="pick_t"></b><span id="pickSub"></span></div><button type="button" id="pickClose" data-t="cancel"></button></div>

/* Geometría de un objeto {P,F,C,UV,tex} → BufferGeometry */
function geometryOf(o){
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(o.P,3));
  if(o.C) g.setAttribute("color",new THREE.BufferAttribute(o.C,3,true));
  if(o.UV) g.setAttribute("uv",new THREE.BufferAttribute(o.UV,2));
  g.setIndex(new THREE.BufferAttribute(o.F,1));
  g.computeBoundingBox(); g.computeBoundingSphere();
  return g;
}

/* Dirección anterior (hacia la cara del paciente) estimada de la forma de U de la arcada */
function guessAnterior(objs){
  let best=null;
  for(const o of objs){ if(!o.P||o.P.length<30) continue;
    const P=o.P, n=P.length/3, step=Math.max(1,Math.floor(n/60000)); let mn=[1e9,1e9], mx=[-1e9,-1e9];
    for(let i=0;i<n;i+=step){ for(let k=0;k<2;k++){ const v=P[3*i+k]; if(v<mn[k]) mn[k]=v; if(v>mx[k]) mx[k]=v; } }
    const c=[(mn[0]+mx[0])/2,(mn[1]+mx[1])/2], w=[mx[0]-mn[0],mx[1]-mn[1]];
    for(let ax=0;ax<2;ax++){ const o2=1-ax; let s=0,m=0;
      for(let i=0;i<n;i+=step){ if(Math.abs(P[3*i+o2]-c[o2])<w[o2]*.1){ s+=(P[3*i+ax]-c[ax])/(w[ax]/2||1); m++; } }
      if(m<20) continue; const score=s/m;
      if(!best||Math.abs(score)>Math.abs(best.score)) best={ax,score}; }
  }
  if(!best||Math.abs(best.score)<.15) return [0,-1,0];
  const d=[0,0,0]; d[best.ax]=best.score>0?1:-1; return d;
}

  stage.insertAdjacentHTML("afterbegin",STAGE_HTML);
  const canvas=stage.querySelector("canvas.view"), labels=stage.querySelector(".mlabels"), cube=stage.querySelector(".vcube"), cubeIn=cube.querySelector(".cube"), triad=stage.querySelector(".triad");
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"default"});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(32,1,.5,8000);
  camera.up.set(0,0,1); scene.add(camera);
  scene.add(new THREE.AmbientLight(0xffffff,.34));
  const keyL=new THREE.DirectionalLight(0xffffff,.82); keyL.position.set(-.55,.75,1); camera.add(keyL);
  const fillL=new THREE.DirectionalLight(0xffffff,.2); fillL.position.set(.9,-.5,.4); camera.add(fillL);
  const world=new THREE.Group(); scene.add(world);
  const measGroup=new THREE.Group(); scene.add(measGroup);
  const nav={target:new V3()}, UP=new V3(0,0,1);
  const S={items:[],anterior:new V3(0,-1,0),measure:false,meas:[],pend:null,curView:null};
  let raf=0;
  let dead=false;
  function render(){ if(raf||dead) return; raf=requestAnimationFrame(()=>{ raf=0; renderer.render(scene,camera); gizmo(); placeLabels(); }); }
  function navApply(){ camera.lookAt(nav.target); camera.updateMatrixWorld(); render(); }
  function resize(){ const w=stage.clientWidth,h=stage.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); render(); }
  new ResizeObserver(resize).observe(stage);

  /* navegación */
  function orbit(dx,dy){
    const tg=nav.target, off=camera.position.clone().sub(tg), k=.008, a0=off.angleTo(UP);
    const atPole=a0<.03||a0>Math.PI-.03;
    off.applyAxisAngle(UP,-dx*k); if(atPole) camera.up.applyAxisAngle(UP,-dx*k);
    let right=new V3().crossVectors(off,UP); if(right.lengthSq()<1e-9) right=new V3().crossVectors(off,camera.up);
    if(right.lengthSq()>1e-9){ right.normalize(); const next=off.clone().applyAxisAngle(right,dy*k), a=next.angleTo(UP);
      if((a>.03&&a<Math.PI-.03)||Math.abs(a-Math.PI/2)<Math.abs(a0-Math.PI/2)) off.copy(next); }
    const a1=off.angleTo(UP); if(a1>.03&&a1<Math.PI-.03) camera.up.copy(UP);
    camera.position.copy(tg).add(off); navApply();
  }
  function pan(dx,dy){ const d=camera.position.distanceTo(nav.target), k=2*d*Math.tan(camera.fov*Math.PI/360)/stage.clientHeight;
    camera.updateMatrixWorld(); const r=new V3().setFromMatrixColumn(camera.matrixWorld,0), u=new V3().setFromMatrixColumn(camera.matrixWorld,1);
    const mv=r.multiplyScalar(-dx*k).add(u.multiplyScalar(dy*k)); camera.position.add(mv); nav.target.add(mv); navApply(); }
  function zoomAt(f,cx,cy){ const rc=canvas.getBoundingClientRect(), ndc=new THREE.Vector2((cx-rc.left)/rc.width*2-1,-(cy-rc.top)/rc.height*2+1);
    const ray=new THREE.Raycaster(); ray.setFromCamera(ndc,camera); const dir=camera.getWorldDirection(new V3());
    const pl=new THREE.Plane().setFromNormalAndCoplanarPoint(dir,nav.target), p=new V3(); if(!ray.ray.intersectPlane(pl,p)) p.copy(nav.target);
    const nd=camera.position.distanceTo(nav.target)*f; if(nd<3||nd>4000) return;
    camera.position.sub(p).multiplyScalar(f).add(p); nav.target.sub(p).multiplyScalar(f).add(p); navApply(); }
  function hit(e){ const rc=canvas.getBoundingClientRect(), ndc=new THREE.Vector2((e.clientX-rc.left)/rc.width*2-1,-(e.clientY-rc.top)/rc.height*2+1);
    const ray=new THREE.Raycaster(); ray.setFromCamera(ndc,camera);
    const ms=S.items.filter(it=>it.mesh.visible&&it.mesh.material.opacity>.25).map(it=>it.mesh);
    const h=ray.intersectObjects(ms,false); return h[0]||null; }
  const ptrs=new Map(); let gest=null;
  canvas.addEventListener("contextmenu",e=>e.preventDefault());
  canvas.addEventListener("pointerdown",e=>{ canvas.focus(); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
    if(ptrs.size===1) gest={mode:(e.button===2||e.button===1||e.shiftKey)?"pan":"orbit",x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:false,btn:e.button};
    else if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; gest={mode:"two",d:Math.hypot(a.x-b.x,a.y-b.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,moved:true}; } });
  canvas.addEventListener("pointermove",e=>{ const p=ptrs.get(e.pointerId); if(!p||!gest) return; p.x=e.clientX; p.y=e.clientY;
    if(gest.mode==="two"&&ptrs.size===2){ const [a,b]=[...ptrs.values()], d=Math.hypot(a.x-b.x,a.y-b.y), cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
      pan(cx-gest.cx,cy-gest.cy); if(d>10&&gest.d>10) zoomAt(gest.d/d,cx,cy); gest.d=d; gest.cx=cx; gest.cy=cy; return; }
    const dx=e.clientX-gest.x, dy=e.clientY-gest.y; if(!gest.moved&&Math.hypot(e.clientX-gest.sx,e.clientY-gest.sy)<4) return; gest.moved=true; gest.x=e.clientX; gest.y=e.clientY;
    if(gest.mode==="pan") pan(dx,dy); else orbit(dx,dy); markView(null); });
  const endPtr=e=>{ const had=ptrs.has(e.pointerId); ptrs.delete(e.pointerId); if(!had) return;
    if(gest&&!gest.moved&&gest.btn===0&&e.type==="pointerup"&&gest.mode==="orbit") onClick(e);
    if(ptrs.size===0) gest=null; else if(ptrs.size===1){ const q=[...ptrs.values()][0]; gest={mode:"orbit",x:q.x,y:q.y,sx:q.x,sy:q.y,moved:true}; } };
  canvas.addEventListener("pointerup",endPtr); canvas.addEventListener("pointercancel",endPtr);
  canvas.addEventListener("wheel",e=>{ e.preventDefault(); zoomAt(Math.exp(e.deltaY*.0015),e.clientX,e.clientY); markView(null); },{passive:false});
  canvas.addEventListener("dblclick",e=>{ const h=hit(e); if(!h) return; const d=h.point.clone().sub(nav.target); nav.target.add(d); camera.position.add(d); navApply(); });
  canvas.addEventListener("keydown",e=>{ const s=e.shiftKey?pan:orbit, k=e.shiftKey?20:12;
    if(e.key==="ArrowLeft") s(-k,0); else if(e.key==="ArrowRight") s(k,0); else if(e.key==="ArrowUp") s(0,-k); else if(e.key==="ArrowDown") s(0,k);
    else if(e.key==="+"||e.key==="=") zoomAt(.85,...center()); else if(e.key==="-") zoomAt(1.18,...center()); else return; e.preventDefault(); });
  const center=()=>{ const r=canvas.getBoundingClientRect(); return [r.left+r.width/2,r.top+r.height/2]; };

  /* medir distancias: dos clics en el modelo */
  function onClick(e){ if(!S.measure) return; const h=hit(e); if(!h){ opt.onMeasure&&opt.onMeasure("miss"); return; }
    const p=h.point.clone();
    if(!S.pend){ S.pend={a:p,dot:dot(p)}; measGroup.add(S.pend.dot); opt.onMeasure&&opt.onMeasure("first"); render(); return; }
    const a=S.pend.a; measGroup.remove(S.pend.dot); S.pend=null;
    const g=new THREE.BufferGeometry().setFromPoints([a,p]);
    const line=new THREE.Line(g,new THREE.LineBasicMaterial({color:new THREE.Color(tok("--ref")||"#ff5a3c"),depthTest:false,transparent:true}));
    line.renderOrder=999; const grp=new THREE.Group(); grp.add(line,dot(a),dot(p)); measGroup.add(grp);
    const el=document.createElement("div"); el.className="mchip"; labels.appendChild(el);
    const m={a,b:p,grp,el,d:a.distanceTo(p)}; S.meas.push(m); el.textContent=fmt(m.d)+" mm";
    opt.onMeasure&&opt.onMeasure("done",m.d); render(); }
  const fmt=v=>v.toLocaleString(document.documentElement.lang||"es",{minimumFractionDigits:2,maximumFractionDigits:2});
  function dot(p){ const s=new THREE.Mesh(new THREE.SphereGeometry(1,12,8),new THREE.MeshBasicMaterial({color:new THREE.Color(tok("--ref")||"#ff5a3c"),depthTest:false})); s.renderOrder=1000; s.position.copy(p); s.userData.dot=true; return s; }
  function clearMeasures(){ S.meas.forEach(m=>{ measGroup.remove(m.grp); m.el.remove(); }); S.meas=[]; if(S.pend){ measGroup.remove(S.pend.dot); S.pend=null; } render(); }
  function setMeasure(on){ S.measure=!!on; stage.classList.toggle("picking",S.measure); if(!on&&S.pend){ measGroup.remove(S.pend.dot); S.pend=null; render(); } }
  function placeLabels(){
    const w=stage.clientWidth,h=stage.clientHeight, rad=camera.position.distanceTo(nav.target)*.004;
    measGroup.traverse(o=>{ if(o.userData.dot) o.scale.setScalar(Math.max(.05,rad)); });
    for(const m of S.meas){ const c=m.a.clone().add(m.b).multiplyScalar(.5).project(camera);
      m.el.style.display=c.z>1?"none":""; m.el.style.left=((c.x+1)/2*w)+"px"; m.el.style.top=((1-c.y)/2*h)+"px"; } }

  /* cubo de vistas y triedro */
  const AXC=[["X","#FF5A4D"],["Y","#35D46A"],["Z","#5AA2FF"]];
  function gizmo(){
    camera.updateMatrixWorld(); const e=camera.matrixWorldInverse.copy(camera.matrixWorld).invert().elements;
    cubeIn.style.transform="matrix3d("+[e[0],-e[1],e[2],0,-e[4],e[5],-e[6],0,e[8],-e[9],e[10],0,0,0,0,1].join(",")+")";
    const ax=[0,1,2].map(k=>({k,x:e[4*k]*26,y:-e[4*k+1]*26,z:e[4*k+2]})).sort((a,b)=>a.z-b.z); let s="";
    ax.forEach(a=>{ const c=AXC[a.k]; s+=`<line x1="0" y1="0" x2="${a.x.toFixed(1)}" y2="${a.y.toFixed(1)}" stroke="${c[1]}" stroke-width="3" stroke-linecap="round"/><text x="${(a.x*1.3).toFixed(1)}" y="${(a.y*1.3+4).toFixed(1)}" text-anchor="middle" fill="${c[1]}" stroke="#1b1b1b" stroke-width="2.5" paint-order="stroke">${c[0]}</text>`; });
    triad.innerHTML=s+'<circle r="2.5" fill="#fff"/>';
  }
  function lookFrom(dir,dist){ const v=dir.clone().normalize(), d=dist||camera.position.distanceTo(nav.target)||200;
    camera.up.copy(UP); if(Math.abs(v.z)>.999){ const a=S.anterior; camera.up.set(a.x,a.y,0); }
    camera.position.copy(nav.target).addScaledVector(v,d); navApply(); }
  cube.querySelectorAll("button").forEach(b=>b.onclick=()=>{ const v=b.dataset.v.split(",").map(Number); lookFrom(new V3(v[0],v[1],v[2])); markView(null); });
  (()=>{ let drag=null, moved=false;
    cube.addEventListener("pointerdown",e=>{ if(e.button!==0) return; drag={x:e.clientX,y:e.clientY,id:e.pointerId}; moved=false; });
    cube.addEventListener("pointermove",e=>{ if(!drag||e.pointerId!==drag.id) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
      if(!moved){ if(Math.hypot(dx,dy)<4) return; moved=true; try{ cube.setPointerCapture(e.pointerId); }catch(_){} cube.classList.add("dragging"); }
      drag.x=e.clientX; drag.y=e.clientY; orbit(dx*1.5,dy*1.5); markView(null); });
    const end=e=>{ if(!drag||(e&&e.pointerId!==drag.id)) return; drag=null; cube.classList.remove("dragging"); };
    cube.addEventListener("pointerup",end); cube.addEventListener("pointercancel",end); cube.addEventListener("lostpointercapture",end);
    cube.addEventListener("click",e=>{ if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; } },true);
  })();

  function visibleBox(){ const b=new THREE.Box3(); world.updateMatrixWorld(true); S.items.forEach(it=>{ if(it.mesh.visible) b.expandByObject(it.mesh); });
    if(b.isEmpty()) S.items.forEach(it=>b.expandByObject(it.mesh)); if(b.isEmpty()) b.set(new V3(-30,-30,-10),new V3(30,30,10)); return b; }
  /* vistas: el paciente mira hacia «anterior» con Z arriba; su derecha = anterior × Z */
  function fit(v){
    const b=visibleBox(), c=b.getCenter(new V3()), r=b.getSize(new V3()).length()/2; nav.target.copy(c);
    const a=S.anterior.clone(), rt=new V3().crossVectors(a,UP).normalize(); let dir;
    if(v&&typeof v==="object"){ /* {az,el} en grados: giro alrededor de Z desde el frente, y elevación */
      const az=v.az*Math.PI/180, el=v.el*Math.PI/180; dir=a.clone().multiplyScalar(Math.cos(az)).add(rt.clone().multiplyScalar(Math.sin(az))).normalize().multiplyScalar(Math.cos(el)).add(new V3(0,0,Math.sin(el))); }
    else if(v==="front") dir=a.clone().add(new V3(0,0,.06));
    else if(v==="right") dir=rt.clone().add(new V3(0,0,.06));
    else if(v==="left") dir=rt.clone().negate().add(new V3(0,0,.06));
    else if(v==="back") dir=a.clone().negate().add(new V3(0,0,.06));
    else if(v==="upper") dir=new V3(0,0,-1);
    else if(v==="lower") dir=new V3(0,0,1);
    else dir=a.clone().multiplyScalar(.85).add(rt.clone().multiplyScalar(.3)).add(new V3(0,0,.55));
    const vh=camera.fov*Math.PI/360, hh=Math.atan(Math.tan(vh)*camera.aspect);

  function markView(v){ S.curView=v; opt.onView&&opt.onView(v); }

  /* objetos */
  function material(o){
    const useC=!!(o.C&&o.natural!==false), useT=!!(o.texImg&&o.natural!==false);
    const m=new THREE.MeshPhongMaterial({flatShading:true,shininess:40,specular:0x2a2a2a,side:THREE.DoubleSide,

    if(useT){ m.map=o.texImg; }
    return m; }
  function applyLook(it){ const o=it.o, m=it.mesh.material, op=o.opacity==null?1:o.opacity, tr=op<.99;
    const useC=!!(o.C&&o.natural!==false), useT=!!(o.texImg&&o.natural!==false);
    m.color.set(useC||useT?"#ffffff":o.color);
    const nm=useT?o.texImg:null; if(m.map!==nm||m.vertexColors!==(useC&&!useT)){ m.map=nm; m.vertexColors=useC&&!useT; m.needsUpdate=true; }
    it.mesh.visible=o.visible!==false&&op>.01; m.transparent=tr; m.opacity=tr?Math.max(.05,op):1; m.depthWrite=!tr;
    const sd=tr?THREE.FrontSide:THREE.DoubleSide; if(m.side!==sd){ m.side=sd; m.needsUpdate=true; }
    it.mesh.renderOrder=tr?10+Math.round((1-op)*10):0; }
  function makeTexture(o){
    if(!o.tex||o.texImg) return; const blob=new Blob([o.tex.data],{type:o.tex.mime||"image/jpeg"}), url=URL.createObjectURL(blob), img=new Image();
    const tx=new THREE.Texture(img); o.texImg=tx;
    img.onload=()=>{ tx.needsUpdate=true; URL.revokeObjectURL(url); render(); }; img.src=url; }
  function setObjects(list){
    S.items.forEach(it=>{ world.remove(it.mesh); it.mesh.geometry.dispose(); it.mesh.material.dispose(); }); S.items=[];
    clearMeasures();
    for(const o of list){ makeTexture(o); const mesh=new THREE.Mesh(geometryOf(o),material(o)); const it={o,mesh}; applyLook(it); world.add(mesh); S.items.push(it); }
    render(); }
  function refresh(){ S.items.forEach(applyLook); render(); }
  function setAnterior(d){ S.anterior.set(d[0],d[1],0).normalize(); if(S.anterior.lengthSq()<.5) S.anterior.set(0,-1,0); }
  function readTheme(){ renderer.setClearColor(new THREE.Color(tok("--stage")||"#1d2530"),1);
    const c=new THREE.Color(tok("--ref")||"#ff5a3c"); measGroup.traverse(o=>{ if(o.material&&o.material.color) o.material.color.copy(c); }); render(); }
  function snapshot(){ renderer.render(scene,camera); return canvas.toDataURL("image/png"); }

  resize(); readTheme();
  /* imagen fija de una vista, del tamaño pedido (para el HTML sin JavaScript) */
  function shot(view,w,h,bg,q){ const ow=stage.clientWidth, oh=stage.clientHeight;
    renderer.setPixelRatio(1); renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
    if(bg) renderer.setClearColor(new THREE.Color(bg),1); fit(view); renderer.render(scene,camera);
    const url=canvas.toDataURL("image/jpeg",q||.85);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); if(ow&&oh){ renderer.setSize(ow,oh,false); camera.aspect=ow/oh; camera.updateProjectionMatrix(); } readTheme();
    return url; }
  function dispose(){ dead=true; if(raf){ cancelAnimationFrame(raf); raf=0; } S.items.forEach(it=>{ it.mesh.geometry.dispose(); it.mesh.material.dispose(); }); S.items=[]; renderer.dispose(); try{ renderer.forceContextLoss(); }catch(e){} }
  return {render,fit,setObjects,refresh,setAnterior,readTheme,setMeasure,clearMeasures,snapshot,visibleBox,shot,dispose,
    get measures(){ return S.meas.map(m=>m.d); }, get view(){ return S.curView; }, camera, nav, canvas, scene, resize};
}

return {create,guessAnterior,geometryOf,STAGE_HTML,tok};
})();

<script>/* Scannice Visor — empaquetado de mallas dentro del HTML.
   Vértices cuantizados a 16 bits por eje dentro de su caja, índices y colores en deltas,
   bytes separados por planos y comprimidos con deflate (fflate). Opcional: AES-GCM 256 con contraseña (PBKDF2). */
window.SNC=(()=>{
"use strict";
const MAGIC=[0x53,0x4E,0x56,0x31]; /* "SNV1" */
const ITER=150000;

function planes(u8,bytesPer){ /* intercala → planos */
  const n=u8.length/bytesPer, out=new Uint8Array(u8.length);
  for(let b=0;b<bytesPer;b++){ const o=b*n; for(let i=0;i<n;i++) out[o+i]=u8[i*bytesPer+b]; } return out; }
function unplanes(u8,bytesPer){
  const n=u8.length/bytesPer, out=new Uint8Array(u8.length);
  for(let b=0;b<bytesPer;b++){ const o=b*n; for(let i=0;i<n;i++) out[i*bytesPer+b]=u8[o+i]; } return out; }

function encodeObj(o){
  const nv=o.P.length/3, nf=o.F.length/3, parts=[];
  const mn=[Infinity,Infinity,Infinity], mx=[-Infinity,-Infinity,-Infinity];
  for(let i=0;i<nv;i++) for(let k=0;k<3;k++){ const v=o.P[3*i+k]; if(v<mn[k]) mn[k]=v; if(v>mx[k]) mx[k]=v; }
  const sc=[0,1,2].map(k=>Math.max(mx[k]-mn[k],1e-6)/65535);
  /* posiciones: delta por eje sobre uint16 */
  const q=new Uint16Array(nv*3), prev=[0,0,0];
  for(let i=0;i<nv;i++) for(let k=0;k<3;k++){ const v=Math.round((o.P[3*i+k]-mn[k])/sc[k]); q[3*i+k]=(v-prev[k])&0xffff; prev[k]=v; }
  parts.push(planes(new Uint8Array(q.buffer),2));
  /* índices: delta + zigzag sobre uint32 */
  const ix=new Uint32Array(nf*3); let p=0;
  for(let i=0;i<nf*3;i++){ const v=o.F[i], d=v-p; p=v; ix[i]=(d<<1)^(d>>31); }
  parts.push(planes(new Uint8Array(ix.buffer),4));
  let hasC=false, hasUV=false, tex=null;
  if(o.C){ hasC=true; const c=new Uint8Array(nv*3), pc=[0,0,0]; for(let i=0;i<nv;i++) for(let k=0;k<3;k++){ const v=o.C[3*i+k]; c[3*i+k]=(v-pc[k])&255; pc[k]=v; } parts.push(planes(c,1)); }
  if(o.UV){ hasUV=true; const u=new Uint16Array(nv*2), pu=[0,0];
    for(let i=0;i<nv;i++) for(let k=0;k<2;k++){ let x=o.UV[2*i+k]; x=x-Math.floor(x); if(o.UV[2*i+k]===1) x=1; const v=Math.round(x*65535); u[2*i+k]=(v-pu[k])&0xffff; pu[k]=v; }
    parts.push(planes(new Uint8Array(u.buffer),2)); }
  if(o.tex){ tex={mime:o.tex.mime,len:o.tex.data.length}; parts.push(o.tex.data); }
  const head={name:o.name,role:o.role,color:o.color,opacity:o.opacity,visible:o.visible!==false,natural:o.natural!==false,nv,nf,mn,sc,hasC,hasUV,tex};
  return {head,parts};
}
function decodeObj(h,buf,off){
  const nv=h.nv, nf=h.nf, o={name:h.name,role:h.role,color:h.color,opacity:h.opacity,visible:h.visible,natural:h.natural};
  let len=nv*6; const q=new Uint16Array(unplanes(buf.subarray(off,off+len),2).buffer); off+=len;
  const P=new Float32Array(nv*3), pv=[0,0,0];
  for(let i=0;i<nv;i++) for(let k=0;k<3;k++){ pv[k]=(pv[k]+q[3*i+k])&0xffff; P[3*i+k]=h.mn[k]+pv[k]*h.sc[k]; }
  o.P=P;
  len=nf*12; const ix=new Uint32Array(unplanes(buf.subarray(off,off+len),4).buffer); off+=len;
  const F=new Uint32Array(nf*3); let p=0;
  for(let i=0;i<nf*3;i++){ const z=ix[i], d=(z>>>1)^-(z&1); p+=d; F[i]=p; } o.F=F;
  if(h.hasC){ len=nv*3; const c=unplanes(buf.subarray(off,off+len),1); off+=len; const C=new Uint8Array(nv*3), pc=[0,0,0];
    for(let i=0;i<nv;i++) for(let k=0;k<3;k++){ pc[k]=(pc[k]+c[3*i+k])&255; C[3*i+k]=pc[k]; } o.C=C; }
  if(h.hasUV){ len=nv*4; const u=new Uint16Array(unplanes(buf.subarray(off,off+len),2).buffer); off+=len; const UV=new Float32Array(nv*2), pu=[0,0];
    for(let i=0;i<nv;i++) for(let k=0;k<2;k++){ pu[k]=(pu[k]+u[2*i+k])&0xffff; UV[2*i+k]=pu[k]/65535; } o.UV=UV; }
  if(h.tex){ o.tex={mime:h.tex.mime,data:buf.slice(off,off+h.tex.len)}; off+=h.tex.len; }
  return [o,off];
}

/* ---------- base64 por trozos ---------- */
function b64enc(u8){ let s=""; const CH=0x8000; for(let i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH)); return btoa(s); }
function b64dec(s){ if(/\s/.test(s)) s=s.replace(/\s+/g,"");

/* enlace: #r=usuario/repositorio&b=rama&c=caso&k=clave  ·  o  #u=url&k=clave */
const SHORT=/^([a-z0-9]{6,16})\.([A-Za-z0-9_-]{16,64})$/;
async function fetchCase(url){
  let res; try{ res=await fetch(url,{cache:"no-store"}); }catch(e){ throw new Error("net"); }
  if(res.status===404) throw new Error("notfound"); if(!res.ok) throw new Error("net");
  const total=+res.headers.get("content-length")||0;
  if(res.body&&res.body.getReader){ const rd=res.body.getReader(), parts=[]; let n=0;
    for(;;){ const {done,value}=await rd.read(); if(done) break; parts.push(value); n+=value.length; $("busySub").textContent=t("dl_mb",(n/1048576).toFixed(1),total?(total/1048576).toFixed(1):"?"); }
    const u=new Uint8Array(n); let o=0; for(const p of parts){ u.set(p,o); o+=p.length; } return u; }
  return new Uint8Array(await res.arrayBuffer());
}
/* enlace: #id.clave (corto)  ·  #r=usuario/repo&c=id&k=clave  ·  #u=url&k=clave */
const QID=/^[a-z0-9]{6,16}$/, QKEY=/^[A-Za-z0-9_-]{16,64}$/;
function linkHash(){ const q=location.search.slice(1).split("&")[0], h=location.hash.slice(1);
  return (QID.test(q)&&QKEY.test(h))?q+"."+h:h; }
async function fromLink(h){
  const m=h.match(SHORT), hp=new URLSearchParams(h), urls=[];
  if(m){ KEY=SNC.b64urlDec(m[2]); const src=window.SNV_SRC||{};
    if(src.repo) urls.push(`https://raw.githubusercontent.com/${src.repo}/${src.branch||"main"}/c/${m[1]}.bin`);
    urls.push(`c/${m[1]}.bin`); }
  else{ KEY=SNC.b64urlDec(hp.get("k"));
    urls.push(hp.get("u")||`https://raw.githubusercontent.com/${hp.get("r")}/${hp.get("b")||"main"}/c/${encodeURIComponent(hp.get("c"))}.bin`); }
  busy(true,"busy_dl");
  let last=null;
  for(let tries=0;tries<8;tries++){
    for(const u of urls){ try{ DATA=await fetchCase(u); return start(); }catch(e){ last=e; } }
    if(!last||last.message!=="notfound") break;
    $("busyTitle").textContent=t("busy_wait"); await new Promise(r=>setTimeout(r,8000)); }
  throw last||new Error("notfound");
}

    if(/\.html?$/i.test(f.name)){ const m=(await f.text()).match(/id="snv-data">([^<]*)</); if(!m) throw new Error("corrupt"); DATA=m[1]; }
    else DATA=new Uint8Array(await f.arrayBuffer());
    start(); }catch(err){ fail(errKey(err)); } };

applyLang();
if(!webglOK()) fail("e_webgl");
else{
  const node=$("snv-data"), hp=new URLSearchParams(location.hash.slice(1));

  else if(SHORT.test(linkHash())||(hp.get("k")&&(hp.get("u")||(hp.get("r")&&hp.get("c"))))) fromLink(linkHash()).catch(err=>{ console.error(err); fail(errKey(err)); });

}
